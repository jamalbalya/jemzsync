# Tag a version (e.g. `git tag 2.0.2 && git push origin 2.0.2`) and this
# workflow proves main.js reproduces from src/, runs the test suite, then
# publishes a GitHub release with the three files Obsidian needs as assets.
#
# The tag must exactly equal the version in manifest.json, with no "v"
# prefix — that is an Obsidian community-plugin requirement.
name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  # Required to sign the build provenance attestation below.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install (no dependencies, but proves the lockfile is sane)
        run: npm ci

      # Obsidian's review reproduces the release from source and compares it
      # against the published asset. This proves the committed main.js is
      # exactly what src/main.js builds, so that comparison cannot fail.
      - name: Verify main.js reproduces from source
        run: npm run build:check

      - name: Run test suite
        run: npm test

      - name: Verify the tests would catch a regression
        run: npm run test:mutation

      - name: Verify tag matches manifest version
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$GITHUB_REF_NAME" != "$MANIFEST_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $MANIFEST_VERSION"
            exit 1
          fi

      # Lets anyone verify cryptographically that these assets were built from
      # this repo at this commit, rather than uploaded by hand.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release with plugin assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
