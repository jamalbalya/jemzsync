# Tag a version (e.g. `git tag 1.3.1 && git push origin 1.3.1`) and this
# workflow runs the test suite, then publishes a GitHub release with the
# three files Obsidian needs as assets.
#
# The tag must exactly equal the version in manifest.json, with no "v"
# prefix — that is an Obsidian community-plugin requirement.
name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  # Required to sign the build provenance attestation below.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run test suite
        run: node test/test-core.js

      - name: Verify the tests would catch a regression
        run: node test/mutation.js

      - name: Verify tag matches manifest version
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$GITHUB_REF_NAME" != "$MANIFEST_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $MANIFEST_VERSION"
            exit 1
          fi

      # Lets anyone verify cryptographically that these assets were built from
      # this repo at this commit, rather than uploaded by hand.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release with plugin assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
